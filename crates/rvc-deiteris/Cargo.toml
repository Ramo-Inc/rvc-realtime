[package]
name = "rvc-deiteris"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
evaluation = ["onnx"]
native = ["dep:ort", "dep:half", "dep:rvc-model"]
onnx = ["dep:ort", "dep:half", "dep:rand", "dep:rand_distr", "dep:libloading", "dep:realfft", "dep:sha2"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "=2.0.0-rc.13", features = ["cuda", "half"], optional = true }
half = { version = "2", optional = true }
rvc-model = { path = "../rvc-model", optional = true }
rand = { version = "0.9", optional = true }
rand_distr = { version = "0.5", optional = true }
libloading = { version = "0.8", optional = true }
realfft = { version = "3.5", optional = true }
sha2 = { version = "0.10", optional = true }

[build-dependencies]
cc = "1"

[[example]]
name = "check_gpu_pitch"
required-features = ["onnx"]
