[package]
name = "rvc-app"
version = "0.1.8"
edition = "2021"
publish = false
description = "Windows app for realtime RVC voice conversion on rvc-engine"

[dependencies]
rvc-engine = { path = "../rvc-engine", features = ["deiteris"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# title-bar icon removal (WS_EX_DLGMODALFRAME)
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# embeds installer/icon/rvc-app.ico as the exe icon
winresource = "0.1"

[profile.release]
debug = false
